<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporal Access Gate</title>
    <!-- Tailwind CSS for modern, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom font import for a stylized, futuristic look */
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap');
        
        body {
            font-family: 'Roboto Mono', monospace;
            background-color: #1a010d; /* Deep Eon-decay red/maroon color */
            color: #d1d5db; /* Light gray text */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: #33031f; /* Darker background for the lock box */
            border: 2px solid #6B011D; /* Eon Decay Hex for validation */
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(107, 1, 29, 0.7); /* Glowing effect */
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        .title {
            color: #fca5a5; /* Light red/pink for emphasis */
            font-weight: 700;
            padding: 8px 0;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 0.1em;
            background-color: #6B011D; /* Eon Decay Hex */
        }

        .input-field {
            background-color: #1a010d;
            border: 1px solid #6B011D;
            color: #10B981; /* Green text for "code" feel */
            font-size: 1.125rem;
            padding: 10px;
            border-radius: 6px;
            width: 100%;
        }
        
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            border: 1px dashed;
        }

        .access-granted {
            border-color: #10B981; /* Green border */
            background-color: rgba(16, 185, 129, 0.1); /* Light green background */
        }

        .access-denied {
            border-color: #EF4444; /* Red border */
            background-color: rgba(239, 68, 68, 0.1); /* Light red background */
        }

        .validate-button {
            background-color: #6B011D; /* Eon Decay Hex */
            color: white;
            padding: 12px 0;
            border-radius: 6px;
            font-weight: 700;
            transition: background-color 0.3s;
            letter-spacing: 0.05em;
        }

        .validate-button:hover {
            background-color: #991c3d; /* Slightly lighter on hover */
        }
    </style>
</head>
<body>

<div class="container">
    <div class="title">DENIAL MATRIX</div>
    
    <p class="text-sm text-center mb-6 text-gray-400">
        // Accessing Temporal Protocol Sub-Node 54.21.08.97<br>
        // Geo-Lock Engaged: Verification Required, Enter the correct location
    </p>

    <label for="anomaly-key" class="block text-sm font-medium mb-2">Enter Anomaly Origin Key:</label>
    <input type="text" id="anomaly-key" class="input-field mb-4" placeholder="Code (e.g., cityname)" onkeypress="if(event.key === 'Enter') validateKey()">

    <button onclick="validateKey()" class="validate-button w-full">
        VALIDATE KEY (INITIATE CHECK)
    </button>

    <div id="result-message" class="result-box hidden"></div>
</div>

<script>
    // Function to decode Base64 string
    function base64Decode(str) {
        try {
            return atob(str);
        } catch (e) {
            console.error("Decoding error:", e);
            return null;
        }
    }

    function validateKey() {
        const input = document.getElementById('anomaly-key').value.toLowerCase().replace(/\s/g, '');
        const resultDiv = document.getElementById('result-message');
        
        // Base64 encoded: 'losangeles' -> 'bG9zYW5nZWxlcw=='
        const encodedKey = 'bG9zYW5nZWxlcw=='; 
        
        // Decode the actual password in memory
        const correctKey = base64Decode(encodedKey); 
        
        // Final Google Doc Link (Replaced by user - MUST be in quotes)
        const finalLink = 'https://docs.google.com/document/d/1szRInEJcepjW6C0Ux37-LxG_FXjk7NnKbFLiJygrqm8/edit?usp=sharing';

        resultDiv.classList.remove('hidden', 'access-granted', 'access-denied');
        resultDiv.innerHTML = '';

        if (!correctKey) {
            resultDiv.classList.add('access-denied');
            resultDiv.innerHTML = '<p class="font-bold text-red-500">ERROR: DECODING FAIL. CONTACT ARCHIVIST.</p>';
            return;
        }

        // For robustness, allow 'losangeles', 'los', or 'la' 
        if (input === correctKey || input === 'los' || input === 'la') {
            
            // Automatic redirect attempt (opens new window/tab)
            window.open(finalLink, '_blank'); 

            // Display link for manual click
            resultDiv.classList.add('access-granted');
            resultDiv.innerHTML = `
                <p class="text-xl font-bold text-green-500 mb-2">[ACCESS GRANTED]</p>
                <p class="text-lg text-green-400 mb-4">PROTOCOL: OBSERVER. TIME.</p>
                
                <p class="text-sm text-gray-300">The Archive is recovered. Lyra Caellum's final note is now accessible.</p>
                <p class="text-sm text-gray-300">The remaining variables are hidden within the document's structure and image caption.</p>
                
                <p class="text-white mt-4 mb-2">PROCEED TO ARCHIVE:</p>
                <!-- This link correctly uses the full Google Doc URL -->
                <a href="${finalLink}" target="_blank" class="text-blue-500 underline hover:text-blue-300 font-semibold text-lg">Final Lyra Caellum Archive Note</a>
            `;
        } else {
            resultDiv.classList.add('access-denied');
            resultDiv.innerHTML = '<p class="font-bold text-red-500">[ACCESS DENIED]</p><p class="text-sm text-gray-400">INPUT MISMATCH. Anomaly origin key rejected. Temporal purge initiated.</p>';
        }
    }

    // Set initial focus on the input field for ease of use
    window.onload = () => {
        document.getElementById('anomaly-key').focus();
    };
</script>
</body>
</html>
